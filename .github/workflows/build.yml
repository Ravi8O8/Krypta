name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: |
          npm install
          npm install --save-dev @capacitor/assets

      - name: Verify Assets (fail-fast)
        run: |
          echo "=== Содержимое assets ==="
          if [ ! -d assets ]; then echo "❌ ERROR: папка assets/ не найдена"; exit 1; fi
          ls -la assets/
          if [ ! -f assets/icon-only.png ]; then echo "❌ ERROR: assets/icon-only.png не найден"; exit 1; fi
          if [ ! -f assets/splash.png ]; then echo "❌ ERROR: assets/splash.png не найден"; exit 1; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Gradle Wrapper
        run: |
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          
          sed -i 's|https\\://services.gradle.org/distributions/gradle-8.2.1-all.zip|https\\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-all.zip|' "$WRAPPER"
          
          sed -i '/networkTimeout/d' "$WRAPPER"
          echo "networkTimeout=60000" >> "$WRAPPER"
          
          echo "=== Итоговый gradle-wrapper.properties ==="
          cat "$WRAPPER"

      - name: Set version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionCode 1/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "=== Итоговые версии в build.gradle ==="
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Generate app icon & splash
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Enable largeHeap in AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'largeHeap' "$MANIFEST"; then
            sed -i 's|<application|<application android:largeHeap="true"|' "$MANIFEST"
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Configure Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > android/app/signing.gradle <<EOT
          android {
              signingConfigs {
                  release {
                      storeFile file('keystore.jks')
                      storePassword '${KEYSTORE_PASSWORD}'
                      keyAlias '${KEY_ALIAS}'
                      keyPassword '${KEY_PASSWORD}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOT
          sed -i "/apply plugin: 'com.android.application'/a apply from: 'signing.gradle'" android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krypta-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
